services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clinicflow
    volumes:
      - clinicflow_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # PostgreSQL is not published to the host.

  api:
    build:
      context: ./backend
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://clinicflow:${POSTGRES_PASSWORD}@postgres:5432/clinicflow
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SEED_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/src/index.js"

  worker:
    build:
      context: ./backend
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://clinicflow:${POSTGRES_PASSWORD}@postgres:5432/clinicflow
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMS_ENABLED: ${SMS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: node dist/src/workers/smsWorker.js

  web:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  clinicflow_pg_prod:
