<!--
  Clinic mark recreated from the painted clinic sign.

  What the sign showed:
  - a house (home / community clinic)
  - a medical plus on the house
  - a stethoscope wrapping around it
  - left tubing blue, right tubing red

  This SVG is the retainable source. The PNG at /logo.png is the
  polished raster version used in the app UI.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Clinic logo">
  <!-- Transparent canvas so the mark sits on any background -->
  <rect width="256" height="256" fill="none" />

  <!-- Left (blue) stethoscope earpiece and tube -->
  <path
    d="M78 46c-22 8-40 34-38 70 2 34 22 58 50 70"
    fill="none"
    stroke="#1B6CB3"
    stroke-width="18"
    stroke-linecap="round"
  />
  <circle cx="70" cy="40" r="14" fill="#1B6CB3" />

  <!-- Right (red) stethoscope earpiece and tube -->
  <path
    d="M178 46c22 8 40 34 38 70-2 34-22 58-50 70"
    fill="none"
    stroke="#C62828"
    stroke-width="18"
    stroke-linecap="round"
  />
  <circle cx="186" cy="40" r="14" fill="#C62828" />

  <!-- House body in clinic blue -->
  <path
    d="M78 150 L78 108 L128 70 L178 108 L178 150
       C178 162 168 172 156 172 L100 172 C88 172 78 162 78 150 Z"
    fill="#1B6CB3"
  />
  <!-- Chimney on the left roof -->
  <rect x="92" y="78" width="14" height="26" rx="2" fill="#1B6CB3" />

  <!-- White medical cross on the house -->
  <rect x="118" y="104" width="20" height="52" rx="4" fill="#FFFFFF" />
  <rect x="102" y="120" width="52" height="20" rx="4" fill="#FFFFFF" />
</svg>
